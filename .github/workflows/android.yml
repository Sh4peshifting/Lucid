name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/panel-awake.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/panel-awake.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'Release signing secrets are required for a tagged release.' >&2
            exit 1
          fi
      - name: Unit tests, Android lint and APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Prepare release files
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/lucid-v0.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/lucid-v0.2.0.apk > dist/SIGNING-CERTIFICATE.txt
          (cd dist && sha256sum lucid-v0.2.0.apk > SHA256SUMS.txt)
      - name: Upload signed release candidate
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/
      - name: Upload emulator test APKs
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            dist/lucid-v0.2.0.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: test-apks
      - name: Download previous version for upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0 --repo Sh4peshifting/Lucid --pattern panel-awake-v0.1.0.apk --dir upgrade
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash scripts/emulator-test.sh
      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: emulator-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'v0.2.0'
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --prerelease --title 'Lucid v0.2.0 · 清醒梦' \
            --notes-file docs/releases/v0.2.0.md
